# OpenOCD config for XC7A35T via FT232H USB Blaster
# RiscV_WebSoC_3 — ACX750 board

# FT232H as JTAG adapter
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi layout_init 0x0ff8 0x0ffb
ftdi layout_signal nTRST -data 0x0100 -oe 0x0100
ftdi layout_signal nSRST -data 0x0200 -oe 0x0200

transport select jtag
# 提升 JTAG 时钟
adapter speed 1000

# Xilinx XC7 series (Artix-7 XC7A35T)
# 使用更宽松的 expected-id 或完全不用
set CHIPNAME xc7a35t
jtag newtap $CHIPNAME tap -irlen 6 -ignore-version

pld device virtex2 $CHIPNAME.tap 1

set XC7_JSHUTDOWN 0x0d
set XC7_JPROGRAM 0x0b
set XC7_JSTART 0x0c
set XC7_BYPASS 0x3f

proc xc7_program {tap} {
    global XC7_JSHUTDOWN XC7_JPROGRAM XC7_JSTART XC7_BYPASS
    irscan $tap $XC7_JSHUTDOWN
    irscan $tap $XC7_JPROGRAM
    runtest 60000
    runtest 2000
    irscan $tap $XC7_BYPASS
    runtest 2000
}

init
xc7_program xc7a35t.tap
pld load 0 /home/zhihuiw/fpga_work/Prj/RiscV_WebSoC_3/build_xilinx/RiscV_WebSoC.bit
shutdown
